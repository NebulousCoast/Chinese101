<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>如果……？ · What If? · WHooF</title>
<style>
  :root{
    --bg:#fff7ec; --ink:#2d2a26; --accent:#ff8a3d; --accent-dark:#e96f1f;
    --soft:#ffe3c7; --line:#f0d9bf; --muted:#8a7a66;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","WenQuanYi Zen Hei",system-ui,sans-serif;
    background:radial-gradient(circle at 20% -10%,#ffe9d2,var(--bg));color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  header{text-align:center;margin-bottom:10px}
  header h1{font-size:1.5rem;margin:0}
  header p{margin:3px 0 0;color:var(--muted);font-size:.85rem}
  header a{color:var(--accent-dark)}
  .wrap{width:100%;max-width:960px}

  /* episode picker */
  .eps{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
  .ep{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 14px;font-size:.88rem;cursor:pointer;color:var(--ink)}
  .ep.on{border-color:var(--accent);background:linear-gradient(135deg,var(--accent),#ffb066);color:#fff;font-weight:700}
  .ep[disabled]{opacity:.5;cursor:default}

  /* the 16:9 stage — everything inside is sized in cqw so it scales like a video */
  .stage{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;
    border-radius:18px;box-shadow:0 18px 40px -22px rgba(150,90,20,.55);background:#000}
  .scene{position:absolute;inset:0;animation:sceneIn .5s ease-out both}
  .ground{position:absolute;left:0;right:0;top:76%;height:24%}
  .area{position:absolute;inset:0}
  .actor{position:absolute;line-height:1;transform-origin:50% 100%;
    font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
  .actor>span{display:inline-block}
  .actor.flip>span{transform:scaleX(-1)}
  .label{position:absolute;transform:translate(-50%,-50%);background:#fff;border:.25cqw solid var(--ink);
    border-radius:2cqw;padding:.6cqw 1.6cqw;font-size:2.4cqw;font-weight:800;white-space:nowrap;
    box-shadow:0 .5cqw 0 rgba(0,0,0,.15)}

  .title{position:absolute;left:0;right:0;top:12%;text-align:center;color:#fff;
    text-shadow:0 .4cqw 0 rgba(0,0,0,.25)}
  .title .zh{font-size:6.4cqw;font-weight:900;letter-spacing:.2cqw}
  .title .en{font-size:3cqw;font-weight:700;margin-top:.8cqw;opacity:.95}
  .title .kicker{display:inline-block;background:rgba(255,255,255,.25);border-radius:99px;
    padding:.4cqw 1.6cqw;font-size:2cqw;margin-bottom:1.2cqw;font-weight:700}

  .cap{position:absolute;left:3%;right:3%;bottom:3.5%;display:flex;gap:1.6cqw;align-items:center;
    background:rgba(255,255,255,.94);border-radius:2cqw;padding:1.4cqw 2cqw;
    box-shadow:0 .6cqw 1.6cqw -.6cqw rgba(0,0,0,.35);animation:capIn .5s .25s ease-out both}
  .cap .who{flex:0 0 auto;text-align:center;font-size:4.4cqw;line-height:1}
  .cap .who small{display:block;font-size:1.4cqw;font-weight:800;color:var(--accent-dark);margin-top:.3cqw;
    font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","WenQuanYi Zen Hei",sans-serif}
  .cap .zh{font-size:2.85cqw;font-weight:800;line-height:1.35}
  .cap .en{font-size:1.85cqw;color:#7a6a55;margin-top:.4cqw;line-height:1.3}
  .stage.hide-en .cap .en,.stage.hide-zh .cap .zh,.stage.hide-zh .title .zh{display:none}

  .vocab{position:absolute;left:5%;right:5%;top:20%;display:grid;grid-template-columns:repeat(3,1fr);gap:1.8cqw}
  .vcard{background:#fff;border-radius:1.8cqw;padding:1.4cqw;text-align:center;
    box-shadow:0 .6cqw 0 rgba(0,0,0,.12);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
  .vcard .h{font-size:5cqw;font-weight:900;color:var(--accent-dark);line-height:1.15}
  .vcard .p{font-size:2.1cqw;font-weight:700;color:#5c7cfa}
  .vcard .e{font-size:1.8cqw;color:#7a6a55}

  /* actor animations — each uses its own property so they can stack */
  @keyframes sceneIn{from{opacity:0}to{opacity:1}}
  @keyframes capIn{from{opacity:0;translate:0 2cqw}to{opacity:1;translate:0 0}}
  @keyframes pop{0%{scale:0}70%{scale:1.15}100%{scale:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes move{from{translate:var(--mx) var(--my)}to{translate:0 0}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2cqw)}}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-2.4cqw)}60%{transform:translateY(-2.4cqw)}}
  @keyframes wiggle{0%,100%{rotate:-8deg}50%{rotate:8deg}}
  @keyframes spin{to{rotate:360deg}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.6cqw)}75%{transform:translateX(.6cqw)}}
  @keyframes pulse{0%,100%{scale:1}50%{scale:1.12}}
  @keyframes flap{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1cqw) scaleY(.85)}}

  /* controls */
  .bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:12px 0 6px;position:relative;cursor:pointer}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffb066)}
  .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
  .btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:.95rem;cursor:pointer;color:var(--ink)}
  .btn.main{background:linear-gradient(135deg,var(--accent),#ffb066);color:#fff;border-color:var(--accent);font-weight:800;min-width:110px}
  .sel{display:flex;gap:4px;align-items:center;font-size:.82rem;color:var(--muted)}
  .sel select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;font-size:.88rem}
  .note{font-size:.8rem;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6}

  .playover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.25);cursor:pointer;z-index:5}
  .playover b{width:12cqw;height:12cqw;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:5cqw;color:var(--accent-dark);box-shadow:0 1cqw 3cqw rgba(0,0,0,.3);padding-left:1cqw}

  /* reel mode (9:16): the picture area sits in the upper part, captions above the Reels/Shorts UI */
  .stage.reel{aspect-ratio:9/16;--k:1.6}
  .stage.reel .area{top:13%;height:52%;bottom:auto}
  .stage.reel .area .ground{height:200%}
  .stage.reel .label{font-size:4.4cqw;border-width:.45cqw;padding:1cqw 2.6cqw;border-radius:3cqw}
  .stage.reel .title{top:9%;padding:0 6%;display:flex;flex-direction:column;align-items:center}
  .stage.reel .title .en{order:1;font-size:8.4cqw;font-weight:900;line-height:1.15;margin:0}
  .stage.reel .title .zh{order:2;font-size:6cqw;line-height:1.3;margin-top:2cqw;font-weight:800}
  .stage.reel .title .kicker{font-size:4.4cqw;padding:1cqw 3.4cqw;margin-bottom:2.6cqw;background:rgba(0,0,0,.16)}
  .stage.reel .cap{top:auto;bottom:19%;left:5%;right:5%;gap:2.6cqw;padding:2.8cqw 3.4cqw;border-radius:4cqw}
  .stage.reel .cap .who{font-size:7cqw}
  .stage.reel .cap>div:last-child{display:flex;flex-direction:column-reverse}   /* English first, Chinese under it */
  .stage.reel .cap .en{font-size:4.8cqw;line-height:1.3;color:var(--ink);font-weight:800;margin:0}
  .stage.reel .cap .zh{font-size:3.7cqw;line-height:1.4;color:#7a6a55;font-weight:700;margin-top:1.4cqw}
  .stage.reel .title .kicker{order:0}
  .stage.reel .vocab{top:22%;left:7%;right:7%;grid-template-columns:repeat(2,1fr);gap:3.6cqw}
  .stage.reel .vcard{padding:3cqw;border-radius:3.6cqw}
  .stage.reel .vcard .h{font-size:11cqw}
  .stage.reel .vcard .p{font-size:4.6cqw}
  .stage.reel .vcard .e{font-size:3.8cqw}
  /* render mode: just the stage, edge to edge */
  body.render{padding:0;background:#000;display:block}
  body.render header,body.render .eps,body.render .bar,body.render .ctrls,body.render .note{display:none}
  body.render .wrap{max-width:none}
  body.render .stage{border-radius:0;width:100vw;height:100vh;aspect-ratio:auto}
</style>
</head>

const ANIM = {               // name → [duration s, timing, iterations, fill]
  pop:   [.6,"cubic-bezier(.3,1.6,.5,1)",1,"both"],
  fade:  [.6,"ease-out",1,"both"],
  move:  [2,"ease-in-out",1,"both"],
  bob:   [2,"ease-in-out","infinite","none"],
  hop:   [.45,"ease-in-out","infinite","none"],
  wiggle:[1.4,"ease-in-out","infinite","none"],
  spin:  [3,"linear","infinite","none"],
  shake: [.3,"linear","infinite","none"],
  pulse: [1.2,"ease-in-out","infinite","none"],
  flap:  [.5,"ease-in-out","infinite","none"],
};
const $ = id => document.getElementById(id);
const stage = $("stage");
const params = new URLSearchParams(location.search);
const RENDER = params.has("render");

let ep = EPISODES[0], idx = 0, playing = false, started = false;
let timer = null, sceneStartedAt = 0, elapsedBefore = 0, speechDone = true, timeDone = false;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function buildScene(sc){
  const parts = [];
  if (sc.g) parts.push(`<div class="ground" style="background:${sc.g}"></div>`);
  for (const a of sc.a || []){
    const names = a.an.split(/\s+/).filter(Boolean);
    // "pop"/"fade" start invisible until their delay; looping ones begin after the entrance.
    const anim = names.map(n => {
      const [dur,tf,it,fill] = ANIM[n];
      const d = n === "move" ? (a.md || dur) : dur;
      const delay = (["pop","fade","move"].includes(n)) ? a.d : a.d + (names.includes("pop") ? .6 : 0);
      return `${n} ${d}s ${tf} ${delay}s ${it} ${fill}`;
    }).join(",");
    const m = a.m || [0,0];
    parts.push(`<div class="actor${a.flip?" flip":""}" style="left:${a.x}%;top:${a.y}%;font-size:calc(${a.s}cqw * var(--k,1));`+
      `margin:calc(-${a.s/2}cqw * var(--k,1)) 0 0 calc(-${a.s/2}cqw * var(--k,1));--mx:${m[0]}cqw;--my:${m[1]}cqw;animation:${anim}"><span>${a.e}</span></div>`);
  }
  for (const l of sc.labels || [])
    parts.push(`<div class="label" style="left:${l.x}%;top:${l.y}%;animation:pop .6s cubic-bezier(.3,1.6,.5,1) ${l.d||0}s both">${esc(l.t)}</div>`);
  parts.unshift(`<div class="area">`); parts.push(`</div>`);   // ground, actors, labels live in the picture area
  if (sc.title){
    parts.push(`<div class="title"><div class="kicker">${esc(sc.title.kicker)}</div>`+
      (sc.title.zh?`<div class="zh">${esc(sc.title.zh)}</div>`:"")+
      (sc.title.en?`<div class="en">${esc(sc.title.en)}</div>`:"")+`</div>`);
  }
  if (sc.vocab){
    parts.push(`<div class="vocab">`+sc.vocab.map((v,i)=>
      `<div class="vcard" style="animation-delay:${.4+i*.5}s"><div class="h">${esc(v[0])}</div><div class="p">${esc(v[1])}</div><div class="e">${esc(v[2])}</div></div>`).join("")+`</div>`);
  }
  if (sc.zh && !sc.title?.zh && !sc.vocab){
    parts.push(`<div class="cap"><div class="who">🧒</div><div>`+
      `<div class="zh">${esc(sc.zh)}</div><div class="en">${esc(sc.en)}</div></div></div>`);
  }
  return `<div class="scene" style="background:${sc.bg}">${parts.join("")}</div>`;
}

function show(i){
  idx = Math.max(0, Math.min(ep.scenes.length - 1, i));
  stage.innerHTML = buildScene(ep.scenes[idx]);
  if (!RENDER && !started) addPlayOverlay();
  updateBar(0);
}

/* ── interactive playback ── */
function speak(sc){
  const mode = $("voiceSel").value;
  speechDone = true;
  if (mode === "off" || !("speechSynthesis" in window)) return;
  const text = mode === "en" ? sc.en : sc.zh;
  if (!text) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = mode === "en" ? "en-US" : "zh-TW";
  u.rate = mode === "en" ? .95 : .85;
  u.pitch = 1.15;                                // a little higher — it's a kid talking
  const re = mode === "en" ? /^en/i : /zh|cmn|Chinese/i;
  const v = speechSynthesis.getVoices().find(v => re.test(v.lang + " " + v.name));
  if (v) u.voice = v;
  speechDone = false;
  u.onend = u.onerror = () => { speechDone = true; maybeAdvance(); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function maybeAdvance(){
  if (!playing || !timeDone || !speechDone) return;
  if (idx < ep.scenes.length - 1){ playScene(idx + 1); }
  else { stopPlay(); updateBar(1); }
}
function playScene(i){
  clearTimeout(timer);
  show(i);
  const sc = ep.scenes[idx];
  timeDone = false; elapsedBefore = 0; sceneStartedAt = performance.now();
  speak(sc);
  timer = setTimeout(() => { timeDone = true; maybeAdvance(); }, sc.dur * 1000);
}
function startPlay(){
  started = true; playing = true;
  stage.querySelector(".playover")?.remove();
  $("playBtn").textContent = "⏸ 暫停 Pause";
  playScene(idx);
}
function stopPlay(){
  playing = false; clearTimeout(timer);
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  document.getAnimations().forEach(a => a.pause());
  $("playBtn").textContent = "▶ 播放 Play";
}
function togglePlay(){
  if (playing){ stopPlay(); }
  else if (idx === ep.scenes.length - 1 && timeDone){ idx = 0; startPlay(); }
  else startPlay();
}
function updateBar(frac){
  const n = ep.scenes.length;
  $("barFill").style.width = ((idx + frac) / n * 100) + "%";
}
function tick(){
  if (playing){
    const sc = ep.scenes[idx];
    updateBar(Math.min(1, (performance.now() - sceneStartedAt) / 1000 / sc.dur));
  }
  requestAnimationFrame(tick);
}
function addPlayOverlay(){
  const o = document.createElement("div");
  o.className = "playover"; o.innerHTML = "<b>▶</b>";
  o.onclick = startPlay;
  stage.appendChild(o);
}
function applyCaps(){
  const v = $("capSel").value;
  stage.classList.toggle("hide-en", v === "zh");
  stage.classList.toggle("hide-zh", v === "en");
}
function pickEpisode(id){
  stopPlay(); started = false; timeDone = false;
  ep = EPISODES.find(e => e.id === id) || EPISODES[0];
  if (!RENDER) history.replaceState(null, "", "#" + ep.id);
  renderEpisodeList(); show(0);
}
function renderEpisodeList(){
  const upcoming = ["如果動物會說話？ What if animals could talk?", "如果我會飛？ What if I could fly?"];
  $("eps").innerHTML = EPISODES.map((e,i) =>
      `<button class="ep${e===ep?" on":""}" data-id="${e.id}">第${i+1}集 · ${esc(e.zh)}</button>`).join("") +
    upcoming.map(t => `<button class="ep" disabled>🔒 ${esc(t)}</button>`).join("");
  $("eps").querySelectorAll("button[data-id]").forEach(b => b.onclick = () => pickEpisode(b.dataset.id));
}

/* ── deterministic render mode (used by scripts/render-whatif.mjs to make an MP4) ── */
let shownForRender = -1;
window.timeline = () => ep.scenes.map(s => s.dur);
// Reel render: the render script injects window.REEL = {lines:[{id, scene, lead, tail, vd, en, zh}]}.
// Scenes follow the narration order, each lasts long enough for its voice and its last animation.
function applyReel(R){
  const scenes = R.lines.map(l => {
    const sc = { ...ep.scenes[l.scene] };
    const last = Math.max(0, ...(sc.a || []).map(a => a.d + (a.an.includes("move") ? (a.md || 2) : .6)),
                          ...(sc.labels || []).map(x => (x.d || 0) + .6), ...(sc.vocab || []).map((_, i) => .9 + i * .5));
    sc.dur = +Math.max(l.lead + l.vd + l.tail, last + .8).toFixed(3);
    if (sc.title?.kicker?.includes("Episode")) sc.title = { ...sc.title, kicker: "如果……？ What if?" };
    if (!R.lines.some(x => x.zh)) {   // English-only reel: drop every bit of Chinese on screen
      const noCJK = str => str.replace(/[\u3000-\u303f\u3400-\u9fff\uff00-\uffef]+/g, "").replace(/^\s*[·…]?\s*/, "").trim();
      if (sc.title) sc.title = { ...sc.title, kicker: noCJK(sc.title.kicker).replace(/^[\s·…?？]+/, ""), zh: "" };
      if (sc.labels) sc.labels = sc.labels.map(x => ({ ...x, t: noCJK(x.t) }));
      sc.zh = sc.zh && " ";   // keep the caption box; its Chinese line is hidden
    }
    sc.line = l; return sc;
  });
  ep = { ...ep, scenes };
  const EV = [], lines = []; let t = 0;
  scenes.forEach((sc, i) => {
    if (i) EV.push({ t: +t.toFixed(3), type: "whoosh", dur: .5, soft: 1 });
    EV.push({ t: +(t + sc.line.lead).toFixed(3), type: "voice", id: sc.line.id });
    lines.push({ id: sc.line.id, en: sc.line.en, zh: sc.line.zh, t0: t, v0: t + sc.line.lead, vd: sc.line.vd, t1: t + sc.dur });
    (sc.a || []).forEach((a, k) => { if (/pop|move/.test(a.an)) EV.push({ t: +(t + a.d).toFixed(3), type: "pop", n: k % 5 }); });
    (sc.vocab || []).forEach((_, k) => EV.push({ t: +(t + .4 + k * .5).toFixed(3), type: "pop", n: k }));
    t += sc.dur;
  });
  const dur = +t.toFixed(2);
  window.EXPORT = { ev: EV.sort((a, b) => a.t - b.t), lines, dur,
    music: { bpm: 108, start: .2, stops: [], end: dur - 1.6, finalAt: dur - 1.6 } };
}
window.seek = t => {
  let start = 0, i = 0;
  while (i < ep.scenes.length - 1 && t >= start + ep.scenes[i].dur){ start += ep.scenes[i].dur; i++; }
  if (i !== shownForRender){ show(i); shownForRender = i; }
  const local = (t - start) * 1000;
  document.getAnimations().forEach(a => { a.pause(); a.currentTime = local; });
};

/* ── boot ── */
if (RENDER){
  document.body.classList.add("render");
  ep = EPISODES.find(e => e.id === params.get("render")) || EPISODES[0];
  if (params.has("reel")) { stage.classList.add("reel"); applyReel(window.REEL); if (!window.REEL.lines.some(x => x.zh)) stage.classList.add("hide-zh"); }
  const cap = params.get("cap");
  if (cap === "zh") stage.classList.add("hide-en");
  if (cap === "en") stage.classList.add("hide-zh");
  show(0);
} else {
  const fromHash = location.hash.slice(1);
  ep = EPISODES.find(e => e.id === fromHash) || EPISODES[0];
  renderEpisodeList(); show(0);
  $("playBtn").onclick = togglePlay;
  $("prevBtn").onclick = () => playing ? playScene(idx - 1) : show(idx - 1);
  $("nextBtn").onclick = () => playing ? playScene(idx + 1) : show(idx + 1);
  $("capSel").onchange = applyCaps;
  $("bar").onclick = e => {
    const r = $("bar").getBoundingClientRect();
    const i = Math.floor((e.clientX - r.left) / r.width * ep.scenes.length);
    playing ? playScene(i) : show(i);
  };
  if ("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; }
  requestAnimationFrame(tick);
}
</script>
</body>
</html>
