<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>碩寬學打字 · Shuòkuān Learns to Type</title>
<style>
  :root{
    --bg:#fff7ec; --card:#fff; --ink:#2d2a26;
    --accent:#ff8a3d; --accent-dark:#e96f1f; --good:#36b37e; --bad:#ef5b5b;
    --soft:#ffe3c7; --line:#f0d9bf; --lit:#7a6a55; --gold:#f2b705;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    background:radial-gradient(circle at 20% -10%,#ffe9d2,var(--bg));color:var(--ink);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
  header{text-align:center;margin-bottom:6px}
  header h1{font-size:1.5rem;margin:0}
  header p{margin:3px 0 0;color:#8a7a66;font-size:.85rem}
  .title-row{display:flex;align-items:center;justify-content:center;gap:12px}
  .title-row>div{text-align:left}
  .avatar{width:54px;height:54px;border-radius:50%;border:3px solid var(--accent);background:#fff;
    font-size:1.9rem;line-height:1;cursor:pointer;box-shadow:0 6px 14px -8px var(--accent-dark);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .1s}
  .avatar:hover{transform:scale(1.06)}
  .buy.avatarpick{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  /* avatar frames (unlocked by level) — apply to avatar + shop preview */
  .f-bronze{border-color:#cd7f32 !important;box-shadow:0 0 0 2px #e8b894}
  .f-silver{border-color:#9aa4af !important;box-shadow:0 0 0 2px #d7dde3}
  .f-gold{border-color:#f2b705 !important;box-shadow:0 0 0 2px #ffe08a,0 0 12px 1px #ffd54a}
  .f-rainbow{border:3px solid transparent !important;
    background:linear-gradient(#fff,#fff) padding-box,
      conic-gradient(from 0deg,#ff5f6d,#ffc371,#47e891,#4ea8ff,#a86bff,#ff5f6d) border-box !important}
  .f-nebula{border:3px solid transparent !important;
    background:radial-gradient(circle at 50% 50%,#fff 60%,#f3e9ff 100%) padding-box,
      conic-gradient(from 0deg,#7d5bff,#c46bff,#4ea8ff,#7d5bff) border-box !important;
    box-shadow:0 0 14px 2px #b98bff;animation:nebula 3s linear infinite}
  @keyframes nebula{to{filter:hue-rotate(360deg)}}
  .frame-prev{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin:0 auto 2px;background:#fff}

  .wrap{width:100%;max-width:640px}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
  .crumb{font-size:.85rem;color:#9b8a74;font-weight:700}
  .crumb b{color:var(--accent-dark)}
  .tbtns{display:flex;gap:6px}
  .mini{font-size:.78rem;border:1px solid var(--line);color:#a9926f;background:#fff;
    border-radius:99px;padding:3px 10px;cursor:pointer}
  .mini.review{border-color:var(--accent);color:#fff;background:linear-gradient(135deg,var(--accent),#ffb066);font-weight:700}
  .chip.weak{border-color:var(--bad);background:#fff5f5}
  .chip .badge{color:var(--bad);font-size:.66rem;font-weight:700}
  .quiz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .quiz-tag{display:inline-block;background:#ffe9e0;color:var(--bad);font-weight:700;font-size:.8rem;border-radius:8px;padding:2px 10px}
  .quiz-list{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0}
  .quiz-pill{background:#fff5f5;border:1px solid #f3c9c9;border-radius:99px;padding:4px 12px;font-size:1rem}
  .quiz-pill .b{color:var(--bad);font-size:.7rem;margin-left:4px}
  .ghost{margin-top:10px;background:#fff;color:#a9926f;border:1px solid var(--line)}
  .progress-wrap{height:11px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ffb066);transition:width .4s}
  .progress-text{font-size:.78rem;color:#9b8a74;margin-bottom:10px}

  .hud{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;position:relative}
  .lvlbadge{font-weight:800;color:#fff;background:linear-gradient(135deg,var(--accent),#ffb066);
    border-radius:8px;display:inline-block;padding:1px 9px;font-size:.95rem;box-shadow:0 4px 10px -4px var(--accent-dark)}
  .xpbar{height:7px;background:var(--soft);border-radius:99px;overflow:hidden;margin:6px 0 3px}
  .xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffd84d);transition:width .4s}
  .xptxt{font-size:.66rem;color:#b9a78f}
  .snum{font-size:1.3rem;font-weight:800;color:var(--accent-dark);line-height:1.2}
  .slab{font-size:.66rem;color:#9b8a74;margin-top:1px}
  .float{position:absolute;left:50%;top:2px;transform:translateX(-50%);color:var(--good);
    font-weight:800;font-size:1rem;animation:floatup .9s forwards;pointer-events:none}
  @keyframes floatup{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-26px);opacity:0}}

  .card{background:var(--card);border-radius:22px;padding:24px 24px 28px;
    box-shadow:0 18px 40px -22px rgba(150,90,20,.5);border:1px solid var(--line)}
  .stage-tag{display:inline-block;background:var(--soft);color:var(--accent-dark);font-weight:700;
    font-size:.8rem;border-radius:8px;padding:2px 10px;margin-bottom:8px}
  .intro{color:#8a7a66;font-size:.92rem;margin:0 0 16px;line-height:1.6}

  .sentence{font-size:1.7rem;line-height:2.5;letter-spacing:1px;text-align:center;margin:6px 0 4px}
  .sentence .lit{color:var(--lit)}
  .sentence .w-future{color:#cdbba2}
  .sentence .w-active{color:var(--accent-dark);font-weight:700;border-bottom:3px solid var(--accent);
    background:#fff3e6;border-radius:6px 6px 0 0;padding:0 2px;animation:pulse 1.4s infinite}
  .sentence .w-done{color:var(--good);font-weight:700}
  @keyframes pulse{0%,100%{background:#fff3e6}50%{background:#ffe6cd}}

  .typer{margin-top:18px;background:#fffaf3;border:1.5px dashed var(--line);border-radius:16px;padding:16px;text-align:center}
  .read-hint{font-size:.8rem;color:#b9a78f;margin-bottom:6px}
  .pic{font-size:3rem;line-height:1;margin:2px 0 4px}
  .hint-hanzi{font-size:2rem;font-weight:700;letter-spacing:4px}
  .hint-pinyin{font-size:1.25rem;color:var(--accent-dark);margin-top:2px;letter-spacing:1px;min-height:1.4em}
  .hint-en{color:#9b8a74;font-size:.9rem;margin-top:1px;font-style:italic}
  .hint-level{font-size:.72rem;color:#b9a78f;margin-top:6px}

  .tiles{display:flex;justify-content:center;gap:6px;margin:14px 0 4px;flex-wrap:wrap}
  .tile{width:38px;height:46px;border-radius:10px;background:#fff;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;color:#cdbba2;transition:all .12s}
  .tile.filled{color:var(--ink)}
  .tile.good{border-color:var(--good);background:#e9faf2;color:var(--good)}
  .tile.bad{border-color:var(--bad);background:#fdeaea;color:var(--bad);animation:shake .25s}
  .tile.cursor{border-color:var(--accent);box-shadow:0 0 0 3px #ffe3c7}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  #typeInput{width:100%;max-width:320px;margin-top:10px;font-size:1.15rem;padding:11px 14px;border-radius:12px;
    border:2px solid var(--line);text-align:center;letter-spacing:2px;outline:none;font-family:inherit}
  #typeInput:focus{border-color:var(--accent)}
  #typeInput::placeholder{letter-spacing:0;color:#cdbba2;font-size:.95rem}
  .feedback{min-height:1.4em;margin-top:9px;font-weight:700}
  .feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}

  .btn{margin-top:14px;background:var(--accent);color:#fff;border:none;border-radius:99px;padding:11px 26px;
    font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 8px 18px -8px var(--accent-dark);transition:transform .1s}
  .btn:hover{transform:translateY(-2px)} .btn:active{transform:translateY(0)}

  .interstitial{text-align:center;padding:14px 0}
  .interstitial .big{font-size:2.6rem}
  .interstitial h2{color:var(--accent-dark);margin:8px 0 4px}
  .interstitial .grade{color:#9b8a74;font-weight:700;margin-bottom:10px}

  .panel{margin-top:16px;background:#fffaf3;border-radius:16px;padding:12px 16px;border:1px solid var(--line)}
  .panel h3{margin:0 0 8px;font-size:.82rem;color:#9b8a74;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:7px;max-height:140px;overflow:auto}
  .chip{background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:.88rem;display:flex;gap:5px;align-items:baseline}
  .chip .py{color:var(--accent-dark);font-size:.74rem}
  .chip .ct{color:#c0ad94;font-size:.7rem}

  .cabinet{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:300px;overflow:auto}
  .slot{border-radius:12px;padding:8px 6px;text-align:center;border:1px solid var(--line);background:#fff}
  .slot.earned{border-color:var(--gold);background:linear-gradient(180deg,#fffdf2,#fff7df);box-shadow:0 6px 14px -10px var(--gold)}
  .slot.locked{opacity:.7;filter:grayscale(.4)}
  .slot .pe{font-size:1.7rem;line-height:1.2}
  .slot .pn{font-size:.66rem;color:#8a7a66;margin-top:2px;line-height:1.25}

  /* shop */
  .shop-sec{margin-top:6px}
  .shop-sec h4{margin:8px 0 6px;font-size:.74rem;color:#9b8a74}
  .shop-row{display:flex;flex-wrap:wrap;gap:8px}
  .shop-row.scrollrow{max-height:178px;overflow:auto;padding:2px 4px 2px 0;align-content:flex-start}
  .shop-row.scrollrow.tall{max-height:250px}
  .buy{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;text-align:center;min-width:84px;cursor:pointer}
  .buy:hover{border-color:var(--accent)}
  .buy.owned{border-color:var(--good);background:#eefaf2;cursor:default}
  .buy.using{border-color:var(--accent);background:#fff3e6}
  .buy.cant{opacity:.45;cursor:not-allowed}
  .buy .be{font-size:1.6rem;line-height:1.2}
  .buy .bn{font-size:.66rem;color:#7a6a55;margin-top:1px}
  .buy .bc{font-size:.68rem;color:var(--accent-dark);font-weight:700;margin-top:2px}
  .pet-box{display:flex;align-items:center;gap:12px}
  .pet-box .pe{font-size:3rem}
  /* quest */
  .quest{display:flex;align-items:center;gap:10px}
  .quest .qbar{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
  .quest .qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb066);transition:width .3s}
  .quest .qtxt{font-size:.8rem;color:#8a7a66;font-weight:700;white-space:nowrap}
  .quest.done .qtxt{color:var(--good)}
  /* question prompt + power-ups + say button */
  .prompt{background:#eef4ff;border:1px solid #d4e3ff;border-radius:12px;padding:10px 12px;margin-bottom:10px;
    color:#3b5b8c;font-size:1rem;text-align:center}
  .prompt b{color:#234d8c}
  .hanzi-row{display:flex;align-items:center;justify-content:center;gap:8px}
  .say{border:1px solid var(--line);background:#fff;border-radius:99px;width:32px;height:32px;cursor:pointer;font-size:1rem}
  .powerups{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .pu{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;font-size:.8rem;cursor:pointer;color:#a9926f}
  .pu:hover{border-color:var(--accent)}
  .pu.cant{opacity:.4;cursor:not-allowed}
  .boost-flag{display:inline-block;background:#fff0d6;color:var(--accent-dark);border-radius:8px;padding:1px 8px;font-size:.72rem;font-weight:700;margin-top:6px}

  /* daily-streak calendar */
  .cal-title{font-size:.78rem;color:#8a7a66;font-weight:700;text-align:center;margin-bottom:4px}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-h{font-size:.68rem;color:#b9a78f;text-align:center;padding:2px 0}
  .cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
    background:#fff;border:1px solid var(--line);font-size:.78rem;color:#9b8a74}
  .cal-d.empty{background:transparent;border:none}
  .cal-d.done{background:#fff1df;border-color:var(--accent)}
  .cal-d.today{box-shadow:0 0 0 2px var(--accent-dark)}

  .toast-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
  .toast{background:#fff;border:2px solid var(--gold);border-radius:20px;padding:18px 28px;text-align:center;
    box-shadow:0 22px 55px -16px rgba(150,90,20,.6);animation:pop .28s ease-out, fadeout .3s 1s forwards}
  .toast .e{font-size:3rem;line-height:1}
  .toast .tz{font-weight:800;color:var(--accent-dark);margin-top:4px}
  .toast .ten{font-size:.82rem;color:#9b8a74}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fadeout{to{opacity:0;transform:scale(.92)}}
</style>
</head>
<body>
  <header>
    <div class="title-row">
      <button class="avatar" id="avatar" title="點我換頭像 · tap to change avatar">🧒</button>
      <div>
        <h1>✏️ 碩寬學打字</h1>
        <p>Shuòkuān Learns to Type — 從單字到句子的拼音打字 · From words to sentences</p>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="topbar">
      <span class="crumb" id="crumb"></span>
      <div class="tbtns">
        <button class="mini review" id="reviewBtn">🧠 複習 Review</button>
        <button class="mini" id="placeBtn">🧭 程度測驗 Placement</button>
        <button class="mini" id="soundBtn">🔊</button>
        <button class="mini" id="restartBtn">重新開始 · Restart</button>
      </div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-text" id="progressText"></div>

    <div class="hud">
      <div class="stat">
        <span class="lvlbadge">Lv.<span id="lvlNum">1</span></span>
        <div class="xpbar"><i id="xpFill"></i></div>
        <div class="xptxt" id="xpTxt">0 / 100 XP</div>
      </div>
      <div class="stat" id="ptsStat"><div class="snum" id="ptsNum">0</div><div class="slab">🪙 金幣 Coins</div></div>
      <div class="stat"><div class="snum" id="strkNum">0</div><div class="slab">🔥 連勝 Streak</div></div>
      <div class="stat"><div class="snum" id="przNum">0</div><div class="slab">🎁 獎品 Prizes</div></div>
    </div>

    <div class="card" id="card"></div>

    <div class="panel" id="questPanel"></div>

    <div class="panel">
      <h3>🛒 商店 · Shop — 用金幣換獎勵 spend your coins</h3>
      <div id="shop"></div>
    </div>

    <div class="panel">
      <h3><span id="dailyAvatar">🧒</span> 每日練習 · Daily Practice — 🔥 連續 <span id="dailyNum">0</span> 天 days</h3>
      <div class="cal-title" id="calTitle"></div>
      <div class="cal" id="calGrid"></div>
    </div>

    <div class="panel">
      <h3>📚 學會讀＋打的字 · Characters you can now read &amp; type</h3>
      <div class="chips" id="chips"></div>
    </div>

    <div class="panel">
      <h3>🎁 獎品櫃 · Prize Cabinet — <span id="przFull">0</span></h3>
      <div class="cabinet" id="cabinet"></div>
    </div>
  </div>

<script>
/* =========================================================================
   VOCABULARY — 碩寬 can already SAY each of these; he is learning to READ
   and TYPE them. `key` = plain pinyin letters to type; `pinyin` = a hint
   that FADES on revisits; `en` = shown only first time; `img` = a picture
   (emoji) for concrete words. Homophones share a `key` but have unique ids.
   ========================================================================= */
const VOCAB = {
  /* ----- Book 1 (Grade 1上) ----- */
  wo:{hanzi:"我",pinyin:"wǒ",key:"wo",en:"I / me"},
  ni:{hanzi:"你",pinyin:"nǐ",key:"ni",en:"you"},
  da:{hanzi:"大",pinyin:"dà",key:"da",en:"big"},
  xiao:{hanzi:"小",pinyin:"xiǎo",key:"xiao",en:"small"},
  ren:{hanzi:"人",pinyin:"rén",key:"ren",en:"person",img:"🧑"},
  kou:{hanzi:"口",pinyin:"kǒu",key:"kou",en:"mouth",img:"👄"},
  shou:{hanzi:"手",pinyin:"shǒu",key:"shou",en:"hand",img:"✋"},
  shan:{hanzi:"山",pinyin:"shān",key:"shan",en:"mountain",img:"⛰️"},
  shui:{hanzi:"水",pinyin:"shuǐ",key:"shui",en:"water",img:"💧"},
  huo:{hanzi:"火",pinyin:"huǒ",key:"huo",en:"fire",img:"🔥"},
  baba:{hanzi:"爸爸",pinyin:"bàba",key:"baba",en:"dad",img:"👨"},
  mama:{hanzi:"媽媽",pinyin:"māma",key:"mama",en:"mom",img:"👩"},
  gege:{hanzi:"哥哥",pinyin:"gēge",key:"gege",en:"big brother",img:"👦"},
  nihao:{hanzi:"你好",pinyin:"nǐhǎo",key:"nihao",en:"hello",img:"👋"},
  dajia:{hanzi:"大家",pinyin:"dàjiā",key:"dajia",en:"everyone",img:"👨‍👩‍👧‍👦"},
  laoshi:{hanzi:"老師",pinyin:"lǎoshī",key:"laoshi",en:"teacher",img:"👩‍🏫"},
  ai:{hanzi:"愛",pinyin:"ài",key:"ai",en:"to love",img:"❤️"},
  hao:{hanzi:"好",pinyin:"hǎo",key:"hao",en:"good",img:"👍"},
  he:{hanzi:"和",pinyin:"hé",key:"he",en:"and"},
  shang:{hanzi:"上",pinyin:"shàng",key:"shang",en:"up / go up",img:"⬆️"},
  shuo:{hanzi:"說",pinyin:"shuō",key:"shuo",en:"to say",img:"💬"},
  zaoan:{hanzi:"早安",pinyin:"zǎo'ān",key:"zaoan",en:"good morning",img:"🌅"},
  kan:{hanzi:"看",pinyin:"kàn",key:"kan",en:"to look / read",img:"👀"},
  /* ----- Book 2 (Grade 1下) ----- */
  xia:{hanzi:"下",pinyin:"xià",key:"xia",en:"down",img:"⬇️"},
  tian:{hanzi:"天",pinyin:"tiān",key:"tian",en:"sky / day",img:"☁️"},
  ri:{hanzi:"日",pinyin:"rì",key:"ri",en:"sun / day",img:"☀️"},
  yue:{hanzi:"月",pinyin:"yuè",key:"yue",en:"moon",img:"🌙"},
  zhong:{hanzi:"中",pinyin:"zhōng",key:"zhong",en:"middle"},
  wen:{hanzi:"文",pinyin:"wén",key:"wen",en:"writing / language",img:"📝"},
  mu:{hanzi:"木",pinyin:"mù",key:"mu",en:"wood / tree",img:"🌳"},
  qu:{hanzi:"去",pinyin:"qù",key:"qu",en:"to go",img:"🚶"},
  lai:{hanzi:"來",pinyin:"lái",key:"lai",en:"to come"},
  zaocan:{hanzi:"早餐",pinyin:"zǎocān",key:"zaocan",en:"breakfast",img:"🍳"},
  xuexiao:{hanzi:"學校",pinyin:"xuéxiào",key:"xuexiao",en:"school",img:"🏫"},
  huijia:{hanzi:"回家",pinyin:"huíjiā",key:"huijia",en:"to go home",img:"🏠"},
  zhongwen:{hanzi:"中文",pinyin:"zhōngwén",key:"zhongwen",en:"Chinese (language)",img:"📖"},
  pengyou:{hanzi:"朋友",pinyin:"péngyǒu",key:"pengyou",en:"friend",img:"👫"},
  chi:{hanzi:"吃",pinyin:"chī",key:"chi",en:"to eat",img:"🍚"},
  gongyuan:{hanzi:"公園",pinyin:"gōngyuán",key:"gongyuan",en:"park",img:"🏞️"},
  wan:{hanzi:"玩",pinyin:"wán",key:"wan",en:"to play",img:"⚽"},
  women:{hanzi:"我們",pinyin:"wǒmen",key:"women",en:"we / us",img:"👨‍👩‍👧"},
  du:{hanzi:"讀",pinyin:"dú",key:"du",en:"to read",img:"📖"},
  shu:{hanzi:"書",pinyin:"shū",key:"shu",en:"book",img:"📚"},
  /* ----- Book 3 (Grade 2上) ----- */
  zi:{hanzi:"字",pinyin:"zì",key:"zi",en:"character / word",img:"🔤"},
  xie:{hanzi:"寫",pinyin:"xiě",key:"xie",en:"to write",img:"✍️"},
  jia:{hanzi:"家",pinyin:"jiā",key:"jia",en:"home / family",img:"🏠"},

/* ---- Per-character accuracy / weakness ---- */
function recordStat(id, errs){ const s=stats[id]||(stats[id]={seen:0,errors:0}); s.seen++; s.errors+=errs; }
function weaknessOf(id){ const s=stats[id]||{seen:0,errors:0}; return s.seen ? s.errors/s.seen : 0; }
function weakWords(n){
  return [...mastered].map(id=>({id, w:weaknessOf(id), e:(stats[id]||{}).errors||0, s:(stats[id]||{}).seen||0}))
    .sort((a,b)=> b.w-a.w || b.e-a.e || a.s-b.s).slice(0,n);
}

// First-introduction order → maps each word to the book that teaches it.
const WORD_BOOK={}, BOOK_WORDS={}, BOOK_START={};
FLAT.forEach((it,i)=>{ if(BOOK_START[it.bookIdx]===undefined) BOOK_START[it.bookIdx]=i;
  it.parts.forEach(p=>{ if(typeof p==="object"&&p.w && WORD_BOOK[p.w]===undefined){
    WORD_BOOK[p.w]=it.bookIdx; (BOOK_WORDS[it.bookIdx]||(BOOK_WORDS[it.bookIdx]=[])).push(p.w); }}); });
// One representative probe word per book (its first new word) for the placement staircase.
const PROBE=CURRICULUM.map((_,bi)=>(BOOK_WORDS[bi]||[])[0]).filter(Boolean);

function srsUpdate(id, errs){
  const s=srs[id]||(srs[id]={box:0,reps:0,lapses:0,intro:true,due:0});
  s.intro=true; s.reps++;
  if(errs===0) s.box=Math.min(5,s.box+1);
  else if(errs>=3){ s.box=Math.max(0,s.box-1); s.lapses++; }
  s.due=srsTick+SRS_IV[s.box];
  if(firstTry[id]===undefined) firstTry[id]=(errs===0);
}
function srsSeed(id, box){ if(srs[id]) return;
  srs[id]={box, reps:0, lapses:0, intro:true, due:srsTick+Math.max(1,SRS_IV[box]-2)}; mastered.add(id); }
function dueQueue(){ return Object.keys(srs).filter(id=>srs[id].intro && srs[id].due<=srsTick && VOCAB[id])
  .sort((a,b)=> srs[a].due-srs[b].due); }
// Decide whether the next turn is an interleaved review (and which word) or new material.
function pickReview(){
  const due=dueQueue(); if(!due.length) return null;
  if(due.length>=SRS_BACKLOG) return due[0];          // clear a backlog aggressively
  if(sinceReview>=NEW_PER_REVIEW) return due[0];        // otherwise space them out
  return null;
}
function bookAccuracy(bi){ const ws=(BOOK_WORDS[bi]||[]); if(!ws.length) return 0;
  const ok=ws.filter(id=>firstTry[id]).length; return ok/ws.length; }

function beep(freq,dur,type,vol,when){
  if(!soundOn) return; const c=ac(); if(!c) return;
  const t=c.currentTime+(when||0);
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+0.03);
}

/* ---- Levels ---- */
function levelFromXP(xp){ let lvl=1, need=100, acc=0;
  while(xp>=acc+need){ acc+=need; lvl++; need=100+(lvl-1)*50; }
  return {level:lvl, into:xp-acc, need}; }
function hintLevel(enc){ if(enc<=1)return 3; if(enc===2)return 2; return 1; }

function speak(text){
  try{ if(!("speechSynthesis" in window)) return;
    const u=new SpeechSynthesisUtterance(text); u.lang="zh-TW"; u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/zh|cmn|Chinese/i.test(v.lang+v.name));
    if(v) u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

/* ---- Daily-streak calendar ---- */
function dkey(dt){ return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function dailyStreak(){
  let s=0; const d=new Date();
  if(!practiceDays.has(dkey(d))) d.setDate(d.getDate()-1);
  while(practiceDays.has(dkey(d))){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function renderCalendar(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const startDow=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(), todayK=dkey(now);
  let cells=["日","一","二","三","四","五","六"].map(d=>`<div class="cal-h">${d}</div>`).join("");
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-d empty"></div>`;
  for(let d=1;d<=dim;d++){ const k=dkey(new Date(y,m,d)); const done=practiceDays.has(k); const today=k===todayK;
    cells+=`<div class="cal-d ${done?"done":""} ${today?"today":""}">${done?"🔥":d}</div>`; }
  document.getElementById("calGrid").innerHTML=cells;
  document.getElementById("calTitle").textContent=`${y} 年 ${m+1} 月`;
  document.getElementById("dailyNum").textContent=dailyStreak();
  const da=document.getElementById("dailyAvatar"); if(da) da.textContent=avatarEmoji();
}

function deriveEarned(){

  CURRICULUM.forEach((b,bi)=>b.stages.forEach((s,si)=>{ if(pos>STAGE_END[bi+"-"+si]) e.add(`stage-${bi}-${si}`); }));
  CURRICULUM.forEach((b,bi)=>{ if(pos>BOOK_END[bi]) e.add(`book-${bi}`); });
  STREAK_MILES.forEach(n=>{ if(maxStreak>=n) e.add(`streak-${n}`); });
  const L=levelFromXP(points).level; LEVEL_MILES.forEach(n=>{ if(L>=n) e.add(`level-${n}`); });
  const ds=dailyStreak(); DAILY_MILES.forEach(n=>{ if(ds>=n) e.add(`daily-${n}`); });
  REVIEW_MILES.forEach(n=>{ if(reviewsDone>=n) e.add(`review-${n}`); });
  return e;
}

function render(){
  if(mode==="story" && !placed){ renderPlacement(); return; }
  if(mode==="story" && pendingCheckpoint!==null){ const bi=pendingCheckpoint; pendingCheckpoint=null; renderCheckpoint(bi); return; }
  const item=FLAT[pos]; const book=CURRICULUM[item.bookIdx];
  if(item.bookFirst && !shownBooks.has(item.bookIdx)){ renderBookIntro(item.bookIdx,book); return; }
  // Spaced-repetition: interleave a due review between new words (at item boundaries).
  if(mode==="story" && wordCursor===0){ const rid=pickReview(); if(rid){ renderSRSReview(rid); return; } }
  const stage=book.stages[item.stageIdx];
  document.getElementById("crumb").innerHTML=`第 ${item.bookIdx+1} 冊 · <b>${book.title}</b> · ${stage.name}`;

  let sentence="", wIdx=-1, activeWord=null;

    if(typeof p==="string"){ sentence+=`<span class="lit">${p}</span>`; return; }
    wIdx++; const v=VOCAB[p.w];
    if(wIdx<wordCursor) sentence+=`<span class="w-done">${v.hanzi}</span>`;
    else if(wIdx===wordCursor){ sentence+=`<span class="w-active">${v.hanzi}</span>`; activeWord=p; }
    else sentence+=`<span class="w-future">${v.hanzi}</span>`;
  });

  let html=`<span class="stage-tag">${stage.name}</span>`;
  if(item.stageFirst) html+=`<p class="intro">${stage.intro}</p>`;

  html+=`<div class="sentence">${sentence}</div>`;

  if(activeWord){
    const v=VOCAB[activeWord.w], lvl=hintLevel(activeWord._enc);
    const opts = (lvl<2 && consumeAuto()) ? {pinyinAlways:true} : {};
    html+=`<div class="typer">${typerPanel(v, lvl, opts)}</div>`;
  }
  card.innerHTML=html;
  refreshSide();
  if(activeWord){
    const v=VOCAB[activeWord.w];
    curInfo={key:v.key, pinyin:v.pinyin, id:activeWord.w, hanzi:v.hanzi};
    wireSayAndPowerups();
    wireInput(v.key, (errs)=>{ recordStat(activeWord.w, errs); success(activeWord, errs); }, null);
  }
}

/* Build the typing panel (shared shape for story / quiz / adaptive) */
function typerPanel(v, lvl, opts){
  opts=opts||{};
  let p=`<div class="read-hint">${opts.head||"👀 讀出這個字，再打出它的拼音 · read it, then type its pinyin"}</div>`;
  if(v.img) p+=`<div class="pic">${v.img}</div>`;
  p+=`<div class="hanzi-row"><div class="hint-hanzi">${v.hanzi}</div><button class="say" id="sayBtn" title="聽發音 hear it">🔊</button></div>`;
  const showPy = opts.pinyinAlways!==undefined ? opts.pinyinAlways : (lvl>=2);
  p+=`<div class="hint-pinyin" id="revealPinyin">${showPy ? v.pinyin : "&nbsp;"}</div>`;
  if(opts.en || lvl>=3) p+=`<div class="hint-en">${v.en}</div>`;
  if(opts.levelTag!==false) p+=`<div class="hint-level">${lvl>=3?"新字 · new":lvl===2?"複習 · review":"靠記憶打字 · from memory 💪"}</div>`;
  p+=`<div class="tiles" id="tiles">${v.key.split("").map(()=>`<div class="tile">·</div>`).join("")}</div>`;
  p+=`<input id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="打拼音… type pinyin" />`;
  p+=`<div class="feedback" id="feedback">&nbsp;</div>`;
  p+=`<div class="powerups" id="powerups"></div>`;
  if(boostLeft>0) p+=`<div class="boost-flag">✨ ${boostMult}× 點數！剩 ${boostLeft} 題</div>`;
  if(luckyLeft>0) p+=`<div class="boost-flag">🍀 +${luckyBonus}/題！剩 ${luckyLeft} 題</div>`;
  return p;
}

let plState=null;
function plMeter(cur){
  let seg="";
  for(let i=PROBE.length-1;i>=0;i--){ const on=i===cur;
    seg+=`<div style="height:8px;margin:2px 0;border-radius:4px;background:${on?'var(--accent)':'#ececec'};${on?'box-shadow:0 0 0 3px rgba(255,138,61,.25)':''}"></div>`; }
  return `<div style="max-width:130px;margin:6px auto"><div class="ct" style="text-align:center;margin-bottom:3px">難 ↑</div>${seg}<div class="ct" style="text-align:center">↓ 易 · 現在試第 ${cur+1} 冊</div></div>`;
}
function renderPlacement(){
  if(!plState){
    document.getElementById("crumb").innerHTML=`🧭 程度測驗 · Placement`;

      打對 → 換更難的字；打錯或不會 → 換簡單一點。大約 7 題就好！<br>

      <button class="btn" id="plStart">開始測驗 · Start ➜</button>

    document.getElementById("plSkip").onclick=()=>placementDone(0);
    return;
  }
  placementProbe();
}
function placementProbe(){
  const st=plState;
  if(st.lo>st.hi || st.n>=st.max){ return placementDone(Math.min(st.lo, PROBE.length-1)); }
  const id=PROBE[st.cur]; const v=VOCAB[id];
  document.getElementById("crumb").innerHTML=`🧭 程度測驗 · ${st.n+1}/${st.max}`;
  let html=`<span class="stage-tag" style="background:#eef9f0;color:var(--good)">🧭 程度測驗 Placement · 第 ${st.n+1} 題</span>`;
  html+=plMeter(st.cur);
  html+=`<div class="typer">${typerPanel(v, 1, {head:"🧭 你會打這個字的拼音嗎？ know this one?", levelTag:false})}
    <div style="text-align:center;margin-top:8px"><button class="btn ghost" id="plDunno">🤔 不會這個字 · I don't know</button></div></div>`;
  card.innerHTML=html; refreshSide();

    srsTick++; st.seen.push({id, ok}); if(ok) st.right++;
    if(ok) st.lo=st.cur+1; else st.hi=st.cur-1;
    st.cur=Math.max(0, Math.min(PROBE.length-1, Math.floor((st.lo+st.hi)/2))); st.n++;
    const fb=document.getElementById("feedback"); fb.className="feedback good";
    fb.textContent= ok?"✓ 太棒了！換難一點…":"沒關係，換簡單一點…";
    setTimeout(placementProbe, ok?650:450); };
  wireInput(v.key, ()=>advance(true), null);
  document.getElementById("plDunno").onclick=()=>advance(false);
}
function placementDone(place){
  place=Math.max(0, Math.min(place, CURRICULUM.length-1));

  for(let bi=0; bi<place; bi++){ shownBooks.add(bi); checkpointsDone.add(bi);

  if(plState) plState.seen.forEach(o=>{ if(o.ok) srsSeed(o.id,3); });
  typedWords=Math.max(typedWords, seeded);

/* Shared typing widget: colours tiles, plays sounds, counts wrong keystrokes.
   onCorrect(errs) fires when the word is typed; onWrong(errs) fires per miss. */
function wireInput(target, onCorrect, onWrong){
  const input=document.getElementById("typeInput"); if(!input) return;
  const tiles=[...document.querySelectorAll("#tiles .tile")];
  let errs=0; input.dataset.len=0;
  input.addEventListener("input",()=>{
    let val=input.value.toLowerCase().replace(/[^a-z]/g,""); input.value=val;
    const prev=+(input.dataset.len||0); input.dataset.len=val.length;
    let allGood=true;
    tiles.forEach((t,i)=>{
      t.classList.remove("good","bad","cursor","filled");
      if(i<val.length){ t.classList.add("filled"); t.textContent=val[i];
        if(val[i]===target[i]) t.classList.add("good"); else { t.classList.add("bad"); allGood=false; } }
      else { t.textContent="·"; if(i===val.length) t.classList.add("cursor"); }
    });
    if(val.length>prev && val!==target){ const i=val.length-1;
      if(val[i]===target[i]) sTick(); else { sWrong(); errs++; if(onWrong) onWrong(errs); } }
    const fb=document.getElementById("feedback");
    if(val===target){ sCorrect(); onCorrect(errs); }
    else { fb.className="feedback"; fb.textContent = val.length&&!allGood ? "再看一次… try again…" : " "; }
  });
  input.focus();
}

const PRAISE=["太棒了！ Great!","好厲害！ Awesome!","答對了！ Correct!","你真聰明！ So smart!","讀對了！ You read it!","完美！ Perfect!"];

function success(active, errs){
  const oldLevel=levelFromXP(points).level; const oldPos=pos;
  mastered.add(active.w); typedWords++; streak++; if(streak>maxStreak) maxStreak=streak;
  srsUpdate(active.w, errs||0); srsTick++; sinceReview++;
  practiceDays.add(dkey(new Date())); bumpQuest();
  const lvl=hintLevel(active._enc);
  let gained = 10 + (lvl===1?8:lvl===2?4:0) + Math.min(streak,10);
  if(luckyLeft>0){ gained+=luckyBonus; luckyLeft--; }    // 🍀 幸運卡
  if(boostLeft>0){ gained*=boostMult; boostLeft--; }     // ✨ 雙倍/三倍卡
  points+=gained; floatPoints("+"+gained); updateHUD();
  const fb=document.getElementById("feedback"); fb.className="feedback good";
  fb.textContent=avatarEmoji()+" ✓ "+PRAISE[Math.floor(Math.random()*PRAISE.length)];

  const item=FLAT[pos];
  const wcount=item.parts.filter(p=>typeof p==="object"&&p.w).length;

  setTimeout(()=>{
    wordCursor++;
    if(wordCursor>=wcount){
      if(wcount>1){ points+=15; sSentence(); queueToast({e:"📝", zh:"句子完成！＋15", en:"Sentence complete! +15"}); }
      wordCursor=0; pos++;
      // Finished the last item of a book → schedule its post-test checkpoint.
      const fb=item.bookIdx;
      if(BOOK_END[fb]===oldPos && !checkpointsDone.has(fb) && pos<FLAT.length) pendingCheckpoint=fb;
    }
    const newLevel=levelFromXP(points).level;
    if(newLevel>oldLevel) sLevel();
    for(let L=oldLevel+1; L<=newLevel; L++) queueToast({e:"⬆️", zh:`升級！等級 ${L}`, en:`Level up! Lv.${L}`});
    syncPrizes(); updateHUD();
    if(pos>=FLAT.length){ save(); showFinish(); return; }
    save(); render();
  },600);
}

function updateHUD(){
  const li=levelFromXP(points);
  document.getElementById("lvlNum").textContent=li.level;
  document.getElementById("xpFill").style.width=Math.round(li.into/li.need*100)+"%";
  document.getElementById("xpTxt").textContent=li.into+" / "+li.need+" XP";
  document.getElementById("ptsNum").textContent=balance();
  document.getElementById("strkNum").textContent=streak;
  document.getElementById("przNum").textContent=prizesEarned.size+"/"+CATALOG.length;
  document.getElementById("przFull").textContent=prizesEarned.size+" / "+CATALOG.length;
}
function updateProgress(){
  const pct=Math.round((typedWords/TOTAL_WORDS)*100);
  document.getElementById("progressBar").style.width=pct+"%";
  const bi=FLAT[Math.min(pos,FLAT.length-1)].bookIdx;
  document.getElementById("progressText").textContent=`進度 ${pct}% · ${typedWords}/${TOTAL_WORDS} 字 · 第 ${bi+1}/${CURRICULUM.length} 冊`;
}
function renderPool(){
  const chips=document.getElementById("chips");
  if(mastered.size===0){ chips.innerHTML=`<span class="ct">還沒有 · none yet — 開始打字吧！</span>`; return; }
  // weakest first, so the pool itself resurfaces shaky characters
  const order=[...mastered].sort((a,b)=> weaknessOf(b)-weaknessOf(a) || (((stats[b]||{}).errors||0)-((stats[a]||{}).errors||0)));
  chips.innerHTML=order.map(k=>{ const v=VOCAB[k]; const e=(stats[k]||{}).errors||0;
    return `<span class="chip ${e>0?"weak":""}">${v.img?v.img+" ":""}<b>${v.hanzi}</b><span class="py">${v.pinyin}</span>`+
           (e>0?`<span class="badge">⚠️${e}</span>`:`<span class="ct">×${seenTotal[k]}</span>`)+`</span>`;
  }).join("");
}
function renderCabinet(){
  document.getElementById("cabinet").innerHTML=CATALOG.map(p=>{
    const got=prizesEarned.has(p.id);
    return `<div class="slot ${got?"earned":"locked"}"><div class="pe">${got?p.emoji:"🔒"}</div><div class="pn">${got?p.zh:p.hint}</div></div>`;
  }).join("");
}

function renderQuest(){
  ensureQuest();
  const el=document.getElementById("questPanel"); if(!el) return;
  const pct=Math.min(100, Math.round(quest.count/quest.goal*100));
  const done=quest.claimed;
  el.innerHTML=`<h3>🎯 每日任務 · Daily Quest</h3>
    <div class="quest ${done?"done":""}">
      <div class="qbar"><i style="width:${pct}%"></i></div>
      <div class="qtxt">${done?`✓ 完成！＋${QUEST_REWARD}🪙`:`今天練習 ${quest.count}/${quest.goal} 題 → ＋${QUEST_REWARD}🪙`}</div>
    </div>`;
}

function renderShop(){
  const el=document.getElementById("shop"); if(!el) return;
  const coin=balance();
  const aff=c=>coin>=c?"":"cant";
  // themes (25)
  let html=`<div class="shop-sec"><h4>🎨 主題 Themes — ${ownedThemes.size}/${Object.keys(THEMES).length}</h4><div class="shop-row scrollrow">`;
  html+=Object.entries(THEMES).map(([k,t])=>{
    const swatch=`<div class="be" style="font-size:1.2rem;width:30px;height:30px;border-radius:8px;margin:0 auto;background:${(t.vars?t.vars["--accent"]:t.accent)}"></div>`;
    if(ownedThemes.has(k)) return `<div class="buy ${theme===k?"using":"owned"}" onclick="useTheme('${k}')">${swatch}<div class="bn">${t.name}</div><div class="bc">${theme===k?"使用中":"已擁有"}</div></div>`;
    return `<div class="buy ${aff(t.cost)}" onclick="buyTheme('${k}')">${swatch}<div class="bn">${t.name}</div><div class="bc">🪙 ${t.cost}</div></div>`;
  }).join("");
  html+=`</div></div>`;
  // power-ups (15)
  html+=`<div class="shop-sec"><h4>⚡ 道具 Power-ups <span style="color:#b9a78f">— 💡${tokens.hint||0} ⏭️${tokens.skip||0} 🔤${tokens.first||0}${boostLeft>0?` · ✨${boostMult}×剩${boostLeft}`:""}${luckyLeft>0?` · 🍀剩${luckyLeft}`:""}${autoHintLeft>0?` · 🧠剩${autoHintLeft}`:""}</span></h4><div class="shop-row scrollrow">`;
  html+=POWERUPS.map(p=>`<div class="buy ${aff(p.cost)}" onclick="buyPower('${p.id}')"><div class="be">${p.e}</div><div class="bn">${p.n}</div><div class="bc">🪙 ${p.cost}</div></div>`).join("");
  html+=`</div></div>`;
  // pets (30) — collect, feed to level up, and use as avatar
  const ownedPets=Object.keys(pets).length;
  html+=`<div class="shop-sec"><h4>🐾 寵物圖鑑 Pet Collection — ${ownedPets}/${Object.keys(PETS).length} <span style="color:#b9a78f;font-weight:400">· 收集動物、餵食升級、設為頭像</span></h4><div class="shop-row scrollrow tall">`;
  html+=Object.entries(PETS).map(([k,p])=>{
    if(pets[k]==null) return `<div class="buy ${aff(p.cost)}" onclick="buyPet('${k}')"><div class="be">${p.e}</div><div class="bn">${p.name}</div><div class="bc">🪙 ${p.cost}</div></div>`;
    const lv=pets[k], max=lv>=PET_MAX, isAv=avatar==="p_"+k;
    return `<div class="buy owned ${isAv?"avatarpick":""}"><div class="be">${p.e}</div><div class="bn">${p.name}<br>${"⭐".repeat(lv)||"Lv.0"}</div>`+
      `<div style="display:flex;gap:4px;justify-content:center;margin-top:3px">`+
      (max?`<span class="bc">滿級✨</span>`:`<button class="pu ${aff(PET_FEED)}" onclick="feedPet('${k}')">🍖${PET_FEED}</button>`)+
      `<button class="pu" onclick="setPetAvatar('${k}')">${isAv?"頭像✓":"🖼️"}</button></div></div>`;
  }).join("");
  html+=`</div></div>`;
  // avatar frames (unlocked by level)
  const myLvl=levelFromXP(points).level;
  html+=`<div class="shop-sec"><h4>🖼️ 頭像框 Avatar Frames <span style="color:#b9a78f;font-weight:400">— 升級解鎖 unlocked by level</span></h4><div class="shop-row">`;
  html+=FRAMES.map(f=>{ const unlocked=myLvl>=f.lvl; const using=frame===f.id;
    const prev=`<div class="frame-prev ${f.id!=="none"?"f-"+f.id:""}">${avatarEmoji()}</div>`;
    if(!unlocked) return `<div class="buy cant">${prev}<div class="bn">${f.name}</div><div class="bc">🔒 Lv.${f.lvl}</div></div>`;
    return `<div class="buy ${using?"using":""}" onclick="selectFrame('${f.id}')">${prev}<div class="bn">${f.name}</div><div class="bc">${using?"使用中 in use":"使用 use"}</div></div>`;
  }).join("");
  html+=`</div></div>`;
  // stickers (60) — owned ones can be set as your avatar
  html+=`<div class="shop-sec"><h4>✨ 貼紙簿 Sticker Book — ${ownedStickers.size}/${STICKERS.length} <span style="color:#b9a78f;font-weight:400">· 點已擁有的貼紙設為頭像 tap an owned sticker to use as avatar</span></h4><div class="shop-row scrollrow tall">`;
  html+=STICKERS.map((s,i)=>{ const owned=ownedStickers.has("s"+i); const isAv=avatar==="s"+i;
    return owned ? `<div class="buy owned ${isAv?"avatarpick":""}" onclick="setAvatar(${i})"><div class="be">${s.e}</div><div class="bn">${s.n}</div><div class="bc">${isAv?"頭像 avatar ✓":"設頭像 set"}</div></div>`
      : `<div class="buy ${aff(STICKER_COST)}" onclick="buySticker(${i})"><div class="be">❔</div><div class="bn">${s.n}</div><div class="bc">🪙 ${STICKER_COST}</div></div>`; }).join("");
  html+=`</div></div>`;
  el.innerHTML=html;
}

/* =========================================================================
   Review / Quiz mode — resurfaces your weakest characters
   ========================================================================= */
function startReview(){ mode="quiz"; renderQuizIntro(); }
function exitReview(){ mode="story"; render(); }

function renderQuizIntro(){
  document.getElementById("crumb").innerHTML=`🧠 複習模式 · Review mode`;
  if(mastered.size===0){
    card.innerHTML=`<div class="interstitial"><div class="big">🧠</div>
      <h2>還沒有字可以複習</h2>
      <p class="intro" style="text-align:center">先去玩故事，學會幾個字，再回來複習你最弱的字！<br>
      Play the story first to learn some characters, then come back.</p>
      <button class="btn ghost" id="backBtn">返回故事 · Back to story</button></div>`;
    refreshSide(); document.getElementById("backBtn").onclick=exitReview; return;
  }
  const n=Math.min(10, mastered.size);
  quizList=weakWords(n).map(o=>o.id); quizIdx=0; quizCorrect=0;
  const preview=weakWords(n);
  const pills=preview.map(o=>{ const v=VOCAB[o.id]; const e=(stats[o.id]||{}).errors||0;
    return `<span class="quiz-pill">${v.img?v.img+" ":""}${v.hanzi}${e>0?`<span class="b">⚠️${e}</span>`:""}</span>`; }).join("");
  card.innerHTML=`<div class="interstitial">
    <div class="big">🧠</div><h2>複習你最弱的字</h2>
    <p class="intro" style="text-align:center">這 ${n} 個字會考你——只給漢字和圖片，<b>拼音要靠自己記</b>！<br>
    Type the pinyin from memory. Hint reveals only after a few misses.</p>
    <div class="quiz-list">${pills}</div>
    <button class="btn" id="goBtn">開始複習 · Start (${n}) ➜</button>
    <div><button class="btn ghost" id="backBtn">返回故事 · Back to story</button></div></div>`;
  refreshSide();
  document.getElementById("goBtn").onclick=renderQuizItem;
  document.getElementById("backBtn").onclick=exitReview;
}

function renderQuizItem(){
  if(quizIdx>=quizList.length){ return renderQuizDone(); }
  const id=quizList[quizIdx]; const v=VOCAB[id];
  document.getElementById("crumb").innerHTML=`🧠 複習 Review · ${quizIdx+1} / ${quizList.length}`;
  let html=`<div class="quiz-head"><span class="quiz-tag">複習 ${quizIdx+1}/${quizList.length}</span>
    <span class="ct" style="color:#9b8a74">✓ ${quizCorrect}</span></div>`;
  html+=`<div class="typer">${typerPanel(v, 1, {head:"🧠 靠記憶打出拼音 · type the pinyin from memory", en:true, pinyinAlways:consumeAuto(), levelTag:false})}
    <button class="btn ghost" id="backBtn">結束複習 · End review</button></div>`;
  card.innerHTML=html; refreshSide();
  curInfo={key:v.key, pinyin:v.pinyin, id, hanzi:v.hanzi};
  wireSayAndPowerups();
  document.getElementById("backBtn").onclick=()=>{ finishReview(); };
  wireInput(v.key,
    (errs)=>{ recordStat(id, errs); if(errs===0) quizCorrect++;
      bumpQuest(); points+=8; floatPoints("+8"); practiceDays.add(dkey(new Date())); updateHUD();
      const fb=document.getElementById("feedback"); fb.className="feedback good";
      fb.textContent= avatarEmoji()+(errs===0 ? " ✓ 答對了！ Nailed it!" : " ✓ 對了！(再記一下) Got it!");
      setTimeout(()=>{ quizIdx++; renderQuizItem(); }, 650); },
    (errs)=>{ if(errs>=3){ const r=document.getElementById("revealPinyin"); if(r) r.innerHTML=`提示 hint: <b>${VOCAB[id].pinyin}</b>`; } });
}

function renderQuizDone(){ finishReview(); }

function finishReview(){
  reviewsDone++;
  const oldLevel=levelFromXP(points).level;
  const done=quizIdx; // attempted count
  // small completion bonus
  points+=10;
  const newLevel=levelFromXP(points).level;
  if(newLevel>oldLevel){ sLevel(); for(let L=oldLevel+1;L<=newLevel;L++) queueToast({e:"⬆️",zh:`升級！等級 ${L}`,en:`Level up! Lv.${L}`}); }
  syncPrizes(); save();
  document.getElementById("crumb").innerHTML=`🧠 複習完成 · Review done`;
  card.innerHTML=`<div class="interstitial">
    <div class="big">🧠✨</div><h2>複習完成！</h2>
    <p class="intro" style="text-align:center">
      你複習了 <b>${done}</b> 個字，一次就答對 <b>${quizCorrect}</b> 個。<br>
      這是你的第 <b>${reviewsDone}</b> 次複習。越練越強！</p>
    <p class="intro" style="text-align:center">Reviewed <b>${done}</b> weak words · <b>${quizCorrect}</b> first-try correct.</p>
    <button class="btn" id="againBtn">再複習一次 · Review again 🔁</button>
    <div><button class="btn ghost" id="backBtn">返回故事 · Back to story</button></div></div>`;
  refreshSide();
  document.getElementById("againBtn").onclick=renderQuizIntro;
  document.getElementById("backBtn").onclick=exitReview;
}

function showFinish(){
  document.getElementById("progressBar").style.width="100%";
  document.getElementById("crumb").innerHTML="全部完成 · All done";
  const li=levelFromXP(points);
  card.innerHTML=`<div class="interstitial">
    <div class="big">${avatarEmoji()}🎓🌟</div><h2>碩寬畢業了！</h2>
    <p class="intro" style="text-align:center">
      從一年級到六年級，碩寬學會讀和打 <b>${mastered.size}</b> 個字／詞，<br>
      拿到 <b>${points}</b> 點數、升到 <b>等級 ${li.level}</b>、收集 <b>${prizesEarned.size}</b> 個獎品！</p>
    <p class="intro" style="text-align:center">
      Grade 1 → 6 · <b>${points}</b> points · <b>Level ${li.level}</b> · <b>${prizesEarned.size}</b> prizes!</p>
    <button class="btn" id="againBtn">再玩一次 · Play again 🔁</button></div>`;
  refreshSide();
  document.getElementById("againBtn").addEventListener("click", resetAll);
}
function resetAll(){
  localStorage.removeItem(SAVE_KEY);
  pos=0; wordCursor=0; typedWords=0; points=0; streak=0; maxStreak=0;
  mastered=new Set(); shownBooks=new Set(); prizesEarned=new Set(); practiceDays=new Set();
  stats={}; reviewsDone=0; mode="story";
  srs={}; srsTick=0; sinceReview=0; placed=false; firstTry={}; bookPre={}; bookPost={};
  checkpointsDone=new Set(); pendingCheckpoint=null;
  spent=0; boostLeft=0; boostMult=2; luckyLeft=0; luckyBonus=0; autoHintLeft=0;
  ownedThemes=new Set(["classic"]); theme="classic";
  ownedStickers=new Set(); pets={}; tokens={hint:0,skip:0,first:0}; quest=null; avatar=null; frame="none";
  warmedStages.clear(); applyTheme("classic"); updateAvatar();
  render();
}
document.getElementById("restartBtn").addEventListener("click",()=>{ if(confirm("重新開始？會清除進度（每日紀錄保留）。Restart and clear progress?")){ const pd=[...practiceDays]; resetAll(); practiceDays=new Set(pd); save(); renderCalendar(); } });

document.getElementById("reviewBtn").addEventListener("click",()=>{ if(mode!=="quiz") startReview(); });
document.getElementById("placeBtn").addEventListener("click",()=>{ if(confirm("重新做程度測驗，找新的起點？New placement test to re-find your starting book?")){ mode="story"; placed=false; plState=null; cpState=null; pendingCheckpoint=null; render(); } });

document.getElementById("avatar").addEventListener("click",()=>{
  const sec=[...document.querySelectorAll(".shop-sec")].find(s=>/貼紙簿/.test(s.textContent));
  (sec||document.getElementById("shop")).scrollIntoView({behavior:"smooth",block:"center"});
});

setupSoundBtn();
load(); applyTheme(theme); ensureQuest(); updateAvatar();
if("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }
render();
</script>
</body>
</html>
